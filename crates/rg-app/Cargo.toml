[package]
name = "rg-app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "realmgenesis"
path = "src/main.rs"

[dependencies]
rg-geo.workspace = true
rg-noise.workspace = true
rg-render.workspace = true
rg-pipeline = { path = "../rg-pipeline" }
rg-world = { path = "../rg-world" }
rg-terrain = { path = "../rg-terrain" }
eframe.workspace = true
egui.workspace = true
egui-wgpu = "0.37"
wgpu.workspace = true
glam.workspace = true
log.workspace = true
web-time = "1.1"
png.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# Tile workers lower their own scheduling class (QoS) on macOS; see tiles.rs.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }
